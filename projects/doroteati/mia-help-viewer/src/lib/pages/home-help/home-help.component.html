<div class="homepage">

  <div class="header">
    <img [src]="config?.backgroundImageHeader" [alt]="config?.titlePage" />
    <div class="container_page">
      @if (config?.titlePage) {
        <h1>{{config?.titlePage}}</h1>
      }

      @if (config?.hasSearch) {
        <div class="search-field">
          <input type="text" placeholder="Buscar" />
          <mat-icon>search</mat-icon>
        </div>
      }
    </div>
  </div>

  <div class="sections">
    <div class="container_page">
      @if (config?.firstText) {
        <h2>{{config?.firstText}}</h2>
      }
      @if (config?.secondText) {
        <p>{{config?.secondText}}</p>
      }
    </div>

    <div class="list-sections">
      @for (category of categories; track category) {
        <div class="section-container">
          <a [routerLink]="[config?.pathDetail + '/' + category.id]" mat-button class="section component-animation animated">
            <img [src]="category.icon" alt="{{ category.title }}">
            <h3> {{ category.title }} </h3>
            <mat-divider></mat-divider>
            <div class="body-2"> {{ category.subtitle }} </div>
          </a>
        </div>
      }
    </div>
  </div>

</div>
